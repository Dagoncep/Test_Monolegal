name: monolegal

services:
  mongo:
    image: mongo:8.0
    container_name: monolegal-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: monolegal
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      # Los scripts de esta carpeta solo se ejecutan la primera vez (volumen vacío)
      - ./docker/mongo-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servidor SMTP de pruebas: captura los correos y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: monolegal-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: src/Monolegal.Api/Dockerfile
    container_name: monolegal-api
    restart: unless-stopped
    environment:
      # Development habilita Swagger en http://localhost:5080/swagger
      ASPNETCORE_ENVIRONMENT: Development
      Mongo__ConnectionString: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongo:27017
      Smtp__Host: mailpit
      Smtp__Puerto: "1025"
    ports:
      - "5080:8080"
    depends_on:
      mongo:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
    container_name: monolegal-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  mongo-data:
